name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # `npm install` rather than `npm ci`: the repo ships without a lockfile
        # so the ranges in package.json resolve on each build.
        run: npm install --no-audit --no-fund

      - name: Validate the data files
        run: npm run validate:data

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # The repo name becomes the URL prefix on github.io.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Add SPA fallback
        # GitHub Pages serves static files only; copying index.html to 404.html
        # makes deep links like /challenges/<id> load the app instead of a 404.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        # Turns Pages on for the repo the first time this runs, so no manual
        # visit to Settings is needed.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
